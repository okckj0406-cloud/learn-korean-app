<!DOCTYPE html>
<!-- dir="rtl" 속성이 아랍어 UI의 핵심입니다 -->
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تعلم الكورية (한국어 학습)</title>
    
    <!-- PWA 매니페스트 연결 -->
    <link rel="manifest" href="manifest.json">
    
    <!-- 아랍어 및 한국어 구글 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', 'Noto Sans KR', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
        }
        
        header { text-align: center; margin-bottom: 30px; color: #333; }
        h1 { margin: 0; font-size: 1.5rem; }
        
        /* 플래시카드 3D 뒤집기 효과 설정 */
        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 350px;
            height: 250px;
            margin-bottom: 30px;
        }
        .card {
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
            position: relative;
        }
        /* flipped 클래스가 추가되면 Y축으로 180도 회전 */
        .card.flipped { transform: rotateY(-180deg); }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        
        /* 앞면: 이집트어 */
        .card-front {
            background: #ffffff;
            color: #2c3e50;
        }
        /* 뒷면: 한국어 (뒤집혀 있으므로 미리 -180도 회전) */
        .card-back {
            background: #0984e3;
            color: #ffffff;
            transform: rotateY(-180deg);
        }

        .word { font-size: 2.5rem; font-weight: bold; margin-bottom: 15px; }
        .example { font-size: 1.1rem; line-height: 1.5; opacity: 0.9; }
        .kr-text { font-family: 'Noto Sans KR', sans-serif; }

        /* 하단 컨트롤 버튼 */
        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 12px;
            background-color: #ffffff;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:active { background-color: #e0e0e0; }
        button:disabled { background-color: #dcdcdc; color: #888; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>

    <header>
        <h1>تطبيق تعلم الكورية</h1>
        <p>한국어 단어장</p>
    </header>

    <!-- 플래시카드 영역 -->
    <div class="card-container" id="cardContainer">
        <div class="card" id="flashcard">
            <!-- 앞면 (아랍어) -->
            <div class="card-face card-front">
                <div class="word" id="arWord"></div>
                <div class="example" id="arExample"></div>
            </div>
            <!-- 뒷면 (한국어) -->
            <div class="card-face card-back">
                <div class="word kr-text" id="krWord"></div>
                <div class="example kr-text" id="krExample"></div>
            </div>
        </div>
    </div>

    <!-- 이전/다음 버튼 -->
    <div class="controls">
        <button id="nextBtn">التالي (다음)</button>
        <button id="prevBtn">السابق (이전)</button>
    </div>

    <script>
        // 1. 단어 데이터 (보유하신 예문 데이터로 교체하세요)
        const wordsData = [
            { 
                ar: "مرحباً", 
                ar_ex: "مرحباً، كيف حالك اليوم؟", 
                kr: "안녕하세요", 
                kr_ex: "안녕하세요, 오늘 하루 어떠세요?" 
            },
            { 
                ar: "شكراً", 
                ar_ex: "شكراً جزيلاً على مساعدتك.", 
                kr: "감사합니다", 
                kr_ex: "도와주셔서 정말 감사합니다." 
            },
            { 
                ar: "طالب", 
                ar_ex: "أنا طالب أدرس اللغة الكورية.", 
                kr: "학생", 
                kr_ex: "저는 한국어를 공부하는 학생입니다." 
            }
        ];

        let currentIndex = 0;

        // DOM 요소 연결
        const flashcard = document.getElementById('flashcard');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // 카드 내용 업데이트 함수
        function updateCard() {
            const currentWord = wordsData[currentIndex];
            
            document.getElementById('arWord').textContent = currentWord.ar;
            document.getElementById('arExample').textContent = currentWord.ar_ex;
            document.getElementById('krWord').textContent = currentWord.kr;
            document.getElementById('krExample').textContent = currentWord.kr_ex;
            
            // 카드가 넘어갈 때 항상 앞면(아랍어)이 보이도록 초기화
            flashcard.classList.remove('flipped');
            
            // 첫 단어, 마지막 단어일 때 버튼 비활성화 처리
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === wordsData.length - 1;
        }

        // 2. 카드 클릭 시 뒤집기 이벤트
        flashcard.addEventListener('click', () => {
            flashcard.classList.toggle('flipped');
        });

        // 3. 이전/다음 버튼 이벤트
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < wordsData.length - 1) {
                currentIndex++;
                updateCard();
            }
        });

        // 초기 화면 세팅
        updateCard();

        // 4. PWA 오프라인 지원을 위한 서비스 워커 등록
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('서비스 워커 등록 성공!', reg.scope))
                    .catch(err => console.log('서비스 워커 등록 실패:', err));
            });
        }
    </script>
</body>
</html>
